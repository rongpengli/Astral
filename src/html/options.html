<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>配置页面</title>
	<link rel="stylesheet" href="../css/options.css" />

	<link rel="icon" href="../favicon.ico?v=1126icons" sizes="any">
	<link rel="icon" type="image/png" sizes="16x16" href="../image/astral-16.png?v=1126icons">
	<link rel="icon" type="image/png" sizes="32x32" href="../image/astral-32.png?v=1126icons">
	<link rel="icon" type="image/png" sizes="48x48" href="../image/astral-48.png?v=1126icons">
	<link rel="icon" type="image/png" sizes="192x192" href="../image/astral-192.png?v=1126icons">
	<link rel="icon" type="image/png" sizes="512x512" href="../image/astral-512.png?v=1126icons">
	<link rel="apple-touch-icon" sizes="180x180" href="../image/apple-touch-icon.png?v=1126icons">
<meta name="color-scheme" content="light dark">
<style>html,body{background:#eee;color:#222;}@media(prefers-color-scheme:dark){html,body{background:#181a1f;color:#e5e7eb;}}</style>
</head>

<body>
	<input id="upload" type="file" hidden="hidden" />
	<div id="edit-modal">
		<div class="group">
			<div class="header">编辑</div>
			<div class="content">
				<table rules="rows">
					<tr>
						<td>标题</td>
						<td><input id="edit-title" placeholder="网站标题" /></td>
					</tr>
					<tr>
						<td>网址</td>
						<td><input id="edit-url" placeholder="网站地址" /></td>
					</tr>
					<tr>
						<td>图标</td>
						<td>
							<div class="icon-editor"><input id="edit-icon" size="50" placeholder="图标地址或Data URL" />
							<button id="edit-upload">上传图标</button>
							<button id="edit-geticon">自动获取</button></div>
						</td>
					</tr>
				</table>
				<div id="confirm">
					<button id="edit-confirm">确认</button>
					<button id="edit-cancel">取消</button>
				</div>
			</div>
		</div>
	</div>
    <div id="group-modal" role="dialog" aria-modal="true" aria-labelledby="group-modal-heading">
        <div class="group">
            <div class="header" id="group-modal-heading">编辑分组</div>
            <div class="content">
                <table><tr><td><label for="group-name">分组名</label></td><td><input id="group-name" type="text" autocomplete="off" placeholder="分组名称"></td></tr></table>
                <div class="dialog-confirm"><button id="group-confirm" type="button">确认</button><button id="group-cancel" type="button">取消</button></div>
            </div>
        </div>
    </div>
    <div id="defaults-modal" role="dialog" aria-modal="true" aria-labelledby="defaults-heading" aria-describedby="defaults-message">
        <div class="group">
            <div class="header" id="defaults-heading">恢复默认</div>
            <div class="content">
                <p id="defaults-message">是否恢复默认？当前选项、导航网址和主页样式将被替换，并采用默认同步设置。</p>
                <div class="dialog-confirm"><button id="defaults-confirm" type="button">确认</button><button id="defaults-cancel" type="button">取消</button></div>
            </div>
        </div>
    </div>
	<div id="logo">
		<a href="https://github.com/rongpengli/Astral" target="_blank">
			<img src="../image/astral-256.png" width="44" height="44" alt="">  Astral 新标签页
		</a>
	</div>
	<div class="group">
        <div class="header"><span class="header-label">选项</span><span id="save-status" role="status" aria-live="polite"></span>
                <div class="header-actions"><button id="config-default">恢复默认</button></div>
            </div>
        <div class="content">
            <fieldset id="settings-fields" disabled>
            <table rules="rows" id="config">
                <tr>
                    <td>主页</td>
                    <td><div class="config-inline home-fields">
                        <label class="inline-choice" for="title">标题</label>
                        <input id="title" type="text" placeholder="主页标题" aria-label="主页标题" />
                        <label class="inline-choice"><input id="newtab-open" type="checkbox" /> 新标签页打开链接</label>
                    </div></td>
                </tr>
                <tr>
                    <td>壁纸</td>
                    <td><div class="config-inline wallpaper-fields">
                        <select id="wallpaper-mode" aria-label="壁纸来源"><option value="bing">Bing 壁纸</option><option value="custom">用户定义</option></select>
                        <span id="bing-controls" class="config-inline">
                        <label class="inline-choice"><input type="checkbox" id="ext-auto-change">自动更新</label>
                        <span class="config-separator" aria-hidden="true"></span>
                        <label class="inline-choice">Bing 壁纸缓存 <select id="bing-max-history" aria-label="Bing 壁纸缓存天数"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select> 天</label>
                        <span class="config-separator" aria-hidden="true"></span>
                        <label class="inline-choice">分辨率 <select id="wallpaper-resolution" aria-label="壁纸分辨率"><option value="2">UHD</option><option value="1">1920×1080</option><option value="0">1366×768</option></select></label>
                        <span class="config-separator" aria-hidden="true"></span>
                        <label class="inline-choice"><input type="checkbox" id="ext-auto-download">自动下载</label>
                        <span class="config-separator" aria-hidden="true"></span>
                        <label class="inline-choice">下载目录 <input id="ext-download-dir" placeholder="下载子目录" aria-label="下载子目录" title="相对于浏览器下载目录；留空则保存到下载根目录"></label>
                        </span>
                        <span id="custom-controls" class="config-inline" hidden>
                          <input id="ext-user-image-src" placeholder="图片地址或 Data URL" aria-label="自定义壁纸地址">
                          <button type="button" id="pick-wallpaper">上传图片</button>
                          <button type="button" id="reset-custom-wallpaper" title="清空自定义图片并恢复默认渐变背景">恢复默认</button>
                          <input type="file" id="wallpaper-file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" hidden>
                          <small>最大 16 MB</small>
                        </span>
                    </div></td>
                </tr>
                <tr>
                    <td>天气</td>
                    <td><div class="config-inline weather-fields">
                        <select id="weather-mode" aria-label="天气显示方式"><option value="native">开启天气</option><option value="off">关闭天气</option></select>
                        <span id="native-location-controls" class="config-inline weather-fields">
                        <label class="inline-choice"><input type="radio" name="weather-location" id="location-manual" value="manual"> 手动</label>
                        <label class="inline-choice"><input type="radio" name="weather-location" id="location-auto" value="auto"> 浏览器定位</label>
                        <button type="button" id="location-refresh" hidden>重新定位</button>
                        <span id="location-status" role="status" aria-live="polite"></span>
                        <span id="weather-manual-fields" class="config-inline weather-fields">
                        <span class="city-search-wrap"><input id="weather-city" type="text" autocomplete="off" placeholder="城市名称" aria-label="天气城市名称" aria-controls="weather-candidates" aria-expanded="false" /><div id="weather-candidates" class="city-suggestions" role="listbox" hidden></div></span>
                        <input id="weather-lat" type="number" step="any" min="-90" max="90" placeholder="纬度" aria-label="纬度" />
                        <input id="weather-lon" type="number" step="any" min="-180" max="180" placeholder="经度" aria-label="经度" />
                        <button id="weather-location-save" type="button">保存位置</button>
                        </span>
                        </span>
                    </div></td>
                </tr>
                <tr id="astral-sync-panel">
                    <td>同步</td>
                    <td><div class="config-inline sync-fields">
                        <select id="astral-sync-mode" aria-label="同步开关"><option value="on">开启同步</option><option value="off">关闭同步</option></select>
                        <span id="astral-sync-tools" class="config-inline sync-tools" hidden>
                        <span class="config-separator" aria-hidden="true"></span>
                        <button id="astral-sync-retry" type="button">立即同步</button>
                        <button id="astral-sync-push" type="button">本机上传</button>
                        <button id="astral-sync-pull" type="button">云端恢复</button>
                        <span id="astral-sync-status" class="field-status" role="status" aria-live="polite">正在检查…</span>
                        <span id="astral-sync-time" class="field-status"></span>
                        <span id="astral-sync-retry-info" class="field-status"></span>
                        <span id="astral-sync-detail" class="field-status" hidden></span>
                        </span>
                    </div></td>
                </tr>
                <tr>
                    <td>辅助</td>
                    <td><div class="config-inline auxiliary-actions">
                        <button id="import">导入</button>
                        <button id="export">导出</button>
                        <button id="open-customize" type="button">定制页面</button>
                    </div></td>
                </tr>
            </table>
            </fieldset>
        </div>
    </div>

	<div class="group">
		<div class="header"><span class="header-label">导航网址</span>
                <div class="header-actions"><button id="new-group">增加分组</button></div>
            </div>
		<div class="content" id="sites">
			<div class="group" id="template-group" hidden="hidden">
				<div class="header"><span class="group-name"></span>
                <div class="header-actions"><button class="group-up">上移</button><button class="group-down">下移</button><button class="group-add">增加</button><button class="group-rename">编辑</button><button class="group-delete">删除</button></div>
            </div>
				<div class="content">
					<table class="group-table">
						<tr class="navigation-heading"><th class="site-info"><span class="row-title">标题</span><span class="row-icon">图标</span><span class="row-url">网址</span></th><th class="site-actions">操作</th></tr>
						<tr class="template-row" hidden="hidden">
							<td class="site-info"><span class="row-title"></span>
							<span class="row-icon"><img /></span>
							<span class="row-url"></span></td>
							<td class="site-actions">
								<button class="row-up">上移</button>
								<button class="row-down">下移</button>
								<button class="row-edit">编辑</button>
								<button class="row-delete">删除</button>
							</td>
						</tr>
					</table>
				</div>
			</div>
		</div>
	</div>
	<script src="../js/site-icons.js"></script>
<script src="../js/compat.js"></script>
<script src="../js/config-schema.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/wallpaper.js"></script>
<script src="../js/weather.js"></script>
<script src="../js/options.js"></script>
<script src="../js/options-sync-ui.js"></script>
<script src="../js/extension-options.js"></script>
</body>

</html>
