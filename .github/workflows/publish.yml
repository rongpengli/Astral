name: Publish browser extension
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Must match manifest.json (e.g. 1.12.7)'
        required: true
        type: string
      target:
        description: 'Store(s) to publish'
        required: true
        default: both
        type: choice
        options: [both, chrome, edge]
      upload_only:
        description: 'Upload without submitting for review'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: browser-extension-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.32,<3"
      - name: Check version and build ZIP
        id: build
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: python scripts/release.py build --source src
      - uses: actions/upload-artifact@v4
        with:
          name: astral-${{ steps.build.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
  chrome:
    if: inputs.target == 'both' || inputs.target == 'chrome'
    needs: package
    runs-on: ubuntu-latest
    environment: extension-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: astral-${{ needs.package.outputs.version }}
          path: release-artifact
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Submit Chrome Web Store
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          UPLOAD_ONLY: ${{ inputs.upload_only }}
        run: |
          args=()
          if [[ "$UPLOAD_ONLY" == 'true' ]]; then args+=(--upload-only); fi
          python scripts/release.py chrome --package "release-artifact/astral-${{ needs.package.outputs.version }}.zip" "${args[@]}"
  edge:
    if: inputs.target == 'both' || inputs.target == 'edge'
    needs: package
    runs-on: ubuntu-latest
    environment: extension-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: astral-${{ needs.package.outputs.version }}
          path: release-artifact
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Submit Edge Add-ons
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          UPLOAD_ONLY: ${{ inputs.upload_only }}
        run: |
          args=()
          if [[ "$UPLOAD_ONLY" == 'true' ]]; then args+=(--upload-only); fi
          python scripts/release.py edge --package "release-artifact/astral-${{ needs.package.outputs.version }}.zip" "${args[@]}"

  release:
    name: Create GitHub Release
    needs: [package, chrome, edge]
    # A formal Release represents a successful two-store submission.
    if: >-
      ${{ always() && inputs.target == 'both' && !inputs.upload_only &&
          needs.package.result == 'success' &&
          needs.chrome.result == 'success' &&
          needs.edge.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: astral-${{ needs.package.outputs.version }}
          path: dist
      - name: Verify package and create checksum
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/astral-${VERSION}.zip"
          (cd dist && sha256sum "astral-${VERSION}.zip" > SHA256SUMS.txt)
      - name: Create release with historical naming
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to reuse it" >&2
            exit 1
          fi
          gh release create "$TAG" \
            "dist/astral-${VERSION}.zip" \
            "dist/SHA256SUMS.txt" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
