name: Publish browser extension
run: python -m pip install requests
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Version in src/manifest.json (e.g. 1.12.7)'
        required: true
        type: string
      target:
        description: 'Target stores'
        required: true
        default: both
        type: choice
        options: [both, chrome, edge]
      upload_only:
        description: 'Upload package without submitting for review'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: astral-store-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          v=json.load(open('src/manifest.json', encoding='utf-8'))['version']
          assert re.fullmatch(r'\d+(?:\.\d+){1,3}',v), 'Invalid version'
          assert v == os.environ['EXPECTED_VERSION'], f'Version mismatch: {v}'
          print(f'version={v}')
          PY
      - name: Check release/tag does not already exist
        if: ${{ !inputs.upload_only && inputs.target == 'both' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"; exit 1
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists"; exit 1
          fi
      - name: Build shared ZIP
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release.py build --source src --output "dist/astral-${EXPECTED_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  chrome:
    if: ${{ inputs.target == 'both' || inputs.target == 'chrome' }}
    needs: build
    runs-on: ubuntu-latest
    environment: extension-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: release-artifact
      - name: Upload / submit Chrome
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          UPLOAD_ONLY: ${{ inputs.upload_only }}
        run: |
          args=()
          if [[ "$UPLOAD_ONLY" == 'true' ]]; then args+=(--upload-only); fi
          python scripts/release.py chrome --package "release-artifact/astral-${EXPECTED_VERSION}.zip" "${args[@]}"

  edge:
    if: ${{ inputs.target == 'both' || inputs.target == 'edge' }}
    needs: build
    runs-on: ubuntu-latest
    environment: extension-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: release-artifact
      - name: Upload / submit Edge
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          UPLOAD_ONLY: ${{ inputs.upload_only }}
        run: |
          args=()
          if [[ "$UPLOAD_ONLY" == 'true' ]]; then args+=(--upload-only); fi
          python scripts/release.py edge --package "release-artifact/astral-${EXPECTED_VERSION}.zip" "${args[@]}"

  release:
    if: ${{ !inputs.upload_only && inputs.target == 'both' }}
    needs: [build, chrome, edge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: release-artifact
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd release-artifact
          sha256sum "astral-${VERSION}.zip" > SHA256SUMS.txt
          cd ..
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "v${VERSION}" \
            "release-artifact/astral-${VERSION}.zip" \
            release-artifact/SHA256SUMS.txt \
            --title "${VERSION}" --generate-notes --target "$GITHUB_SHA"
