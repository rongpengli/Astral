
name: Publish browser extension

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Expected manifest version"
        required: true
        type: string
      target:
        description: "Publishing target"
        required: true
        default: both
        type: choice
        options:
          - both
          - chrome
          - edge
      upload_only:
        description: "Upload without submitting for review"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: astral-extension-publish
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Validate version
        id: version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re

          with open("src/manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)

          version = manifest["version"]
          expected = os.environ["EXPECTED_VERSION"]

          if not re.fullmatch(r"\d+(?:\.\d+){1,3}", version):
              raise SystemExit(f"Invalid version: {version}")

          if version != expected:
              raise SystemExit(
                  f"Version mismatch: {version} != {expected}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
              f.write(f"tag=v{version}\n")

          print(f"Astral version: {version}")
          PY

      - name: Build extension ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist

          python scripts/release.py build \
            --source src \
            --output "dist/astral-${VERSION}.zip"

      - name: Generate SHA256 checksum
        run: |
          cd dist
          sha256sum astral-*.zip > SHA256SUMS.txt

      - name: Upload shared package
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: |
            dist/astral-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish-chrome:
    name: Publish Chrome Web Store
    needs: build

    if: >-
      ${{
        inputs.target == 'both' ||
        inputs.target == 'chrome'
      }}

    runs-on: ubuntu-latest
    environment: extension-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Download shared package
        uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: release-artifact

      - name: Publish Chrome extension
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          UPLOAD_ONLY: ${{ inputs.upload_only }}
        run: |
          args=()

          if [[ "$UPLOAD_ONLY" == "true" ]]; then
            args+=(--upload-only)
          fi

          python scripts/release.py chrome \
            --package "release-artifact/astral-${EXPECTED_VERSION}.zip" \
            "${args[@]}"

  publish-edge:
    name: Publish Microsoft Edge Add-ons
    needs: build

    if: >-
      ${{
        inputs.target == 'both' ||
        inputs.target == 'edge'
      }}

    runs-on: ubuntu-latest
    environment: extension-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Download shared package
        uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: release-artifact

      - name: Publish Edge extension
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          UPLOAD_ONLY: ${{ inputs.upload_only }}
        run: |
          args=()

          if [[ "$UPLOAD_ONLY" == "true" ]]; then
            args+=(--upload-only)
          fi

          python scripts/release.py edge \
            --package "release-artifact/astral-${EXPECTED_VERSION}.zip" \
            "${args[@]}"

  release:
    name: Create GitHub Release

    needs:
      - build
      - publish-chrome
      - publish-edge

    if: >-
      ${{
        always() &&
        github.ref == 'refs/heads/master' &&
        inputs.target == 'both' &&
        inputs.upload_only == false &&
        needs.build.result == 'success' &&
        needs.publish-chrome.result == 'success' &&
        needs.publish-edge.result == 'success'
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download shared package
        uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: release-artifact

      - name: Check existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if git rev-parse -q --verify \
            "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            exit 1
          fi

      - name: Generate release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]

          def git(*args):
              return subprocess.check_output(
                  ["git", *args],
                  text=True
              ).strip()

          def version_key(value):
              match = re.fullmatch(
                  r"v(\d+(?:\.\d+){1,3})",
                  value
              )
              if not match:
                  return None
              return tuple(
                  int(x) for x in match.group(1).split(".")
              )

          tags = git(
              "tag",
              "--merged",
              "HEAD",
              "--list",
              "v*"
          ).splitlines()

          current = version_key(tag)

          previous_tags = [
              t for t in tags
              if version_key(t) is not None
              and version_key(t) < current
          ]

          lines = ["## 更新日志", ""]

          if previous_tags:
              previous = max(
                  previous_tags,
                  key=version_key
              )

              changes = git(
                  "log",
                  "--pretty=format:- %s (%h)",
                  f"{previous}..HEAD",
                  "--",
                  "src/"
              )

              lines.append(
                  changes or "No changes in `src/`."
              )
          else:
              lines.append("Initial release.")

          Path("release-notes.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(
              Path("release-notes.md").read_text()
          )
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "release-artifact/astral-${VERSION}.zip" \
            "release-artifact/SHA256SUMS.txt" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"

      - name: Write release summary
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          {
            echo "## Astral ${VERSION}"
            echo ""
            echo "- Release title: ${VERSION}"
            echo "- Git tag: ${TAG}"
            echo "- Chrome: submitted"
            echo "- Edge: submitted"
            echo "- Release notes: src/ only"
          } >> "$GITHUB_STEP_SUMMARY"
