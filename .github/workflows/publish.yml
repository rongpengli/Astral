name: Publish browser extension

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Version in src/manifest.json (e.g. 1.12.7)'
        required: true
        type: string
      target:
        description: 'Store(s) to publish'
        required: true
        default: both
        type: choice
        options:
          - both
          - chrome
          - edge
      upload_only:
        description: 'Upload only; do not submit for review or create a Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: astral-store-release
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Validate version
        id: version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          manifest = json.loads(Path('src/manifest.json').read_text(encoding='utf-8'))
          version = manifest['version']
          expected = os.environ['EXPECTED_VERSION']
          if not re.fullmatch(r'\d+(?:\.\d+){1,3}', expected):
              raise SystemExit('Invalid expected_version')
          if version != expected:
              raise SystemExit(f'Version mismatch: manifest={version}, expected={expected}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'version={version}\n')
          print(f'Validated version: {version}')
          PY

      - name: Build shared ZIP
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          python scripts/release.py build --source src --output "dist/astral-${EXPECTED_VERSION}.zip"
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          version = os.environ['EXPECTED_VERSION']
          package = Path(f'dist/astral-{version}.zip')
          with zipfile.ZipFile(package) as archive:
              if 'manifest.json' not in archive.namelist():
                  raise SystemExit('ZIP root must contain manifest.json')
              packaged_version = json.loads(archive.read('manifest.json'))['version']
              if packaged_version != version:
                  raise SystemExit(f'ZIP version mismatch: {packaged_version}')
          print(f'Package verified: {package}')
          PY
          cd dist
          sha256sum "astral-${EXPECTED_VERSION}.zip" > SHA256SUMS.txt

      - name: Upload shared package artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: |
            dist/astral-${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish-chrome:
    name: Upload / publish Chrome
    needs: build
    if: ${{ inputs.target == 'both' || inputs.target == 'chrome' }}
    runs-on: ubuntu-latest
    environment: extension-release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Download shared ZIP
        uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: release-artifact

      - name: Verify package checksum
        working-directory: release-artifact
        run: sha256sum -c SHA256SUMS.txt

      - name: Upload / publish Chrome extension
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          UPLOAD_ONLY: ${{ inputs.upload_only }}
        run: |
          args=()
          if [[ "$UPLOAD_ONLY" == 'true' ]]; then args+=(--upload-only); fi
          python scripts/release.py chrome --package "release-artifact/astral-${EXPECTED_VERSION}.zip" "${args[@]}"

  publish-edge:
    name: Upload / publish Edge
    needs: build
    if: ${{ inputs.target == 'both' || inputs.target == 'edge' }}
    runs-on: ubuntu-latest
    environment: extension-release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Download shared ZIP
        uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: release-artifact

      - name: Verify package checksum
        working-directory: release-artifact
        run: sha256sum -c SHA256SUMS.txt

      - name: Upload / publish Edge extension
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          UPLOAD_ONLY: ${{ inputs.upload_only }}
        run: |
          args=()
          if [[ "$UPLOAD_ONLY" == 'true' ]]; then args+=(--upload-only); fi
          python scripts/release.py edge --package "release-artifact/astral-${EXPECTED_VERSION}.zip" "${args[@]}"

  release:
    name: Create GitHub Release
    needs: [build, publish-chrome, publish-edge]
    if: >-
      ${{ always() &&
          inputs.target == 'both' &&
          inputs.upload_only == false &&
          needs.build.result == 'success' &&
          needs.publish-chrome.result == 'success' &&
          needs.publish-edge.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download shared ZIP and checksum
        uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: release-artifact

      - name: Verify package checksum
        working-directory: release-artifact
        run: sha256sum -c SHA256SUMS.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" \
            "release-artifact/astral-${VERSION}.zip" \
            release-artifact/SHA256SUMS.txt \
            --title "$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"
